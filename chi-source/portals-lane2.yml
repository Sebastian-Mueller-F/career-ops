# ---------------------------------------------------------------------------
# FRANKFURT-SPECIFIC MANUAL CHANNELS
# [MANUAL] — Chi Jun should check these directly. Cannot be auto-scanned.
# ---------------------------------------------------------------------------

manual_channels:
  - name: "Facebook: Expats in Frankfurt"
    url: "https://www.facebook.com/groups/expatfrankfurt"
    notes: "Active expat group. Job leads, gig offers, and local recommendations posted regularly. Search for 'looking for' or 'hiring'."
    check_frequency: "2-3x per week"

  - name: "Facebook: English Speaking Frankfurt"
    url: "https://www.facebook.com/groups/englishspeakingfrankfurt"
    notes: "Large English-speaking community. Good for tutoring leads, informal gig work, and local connections."
    check_frequency: "2-3x per week"

  - name: "Facebook: Jobs in Frankfurt am Main"
    url: "https://www.facebook.com/groups/jobsinfrankfurtammain"
    notes: "Local jobs group. Mix of German and English postings."
    check_frequency: "Weekly"

  - name: "Kleinanzeigen — Browse directly"
    url: "https://www.kleinanzeigen.de/stadt/frankfurt-am-main"
    notes: "eBay Kleinanzeigen is Germany's Craigslist. Many informal gig and Minijob listings not indexed by Indeed. Check 'Dienstleistungen' and 'Jobs' categories."
    check_frequency: "2x per week"

  - name: "Internations Frankfurt"
    url: "https://www.internations.org/frankfurt-am-main-expats"
    notes: "Expat networking community. Occasional job leads and connections to international companies in Frankfurt."
    check_frequency: "Weekly"

  - name: "Frankfurt Tourist Board — Guide Registration"
    url: "https://www.frankfurt-tourismus.de"
    notes: "Check if Frankfurt Tourism offers guide registration or referral programmes for independent city guides. Contact directly."
    check_frequency: "One-time check"

  - name: "Meetup Frankfurt — International groups"
    url: "https://www.meetup.com/cities/de/frankfurt"
    notes: "Not a job board, but international meetups lead to English-language work connections in Frankfurt."
    check_frequency: "Weekly browse"
