compensation:
  target_range: "Market rate for Frankfurt — any legal wage accepted"
  currency: "EUR"
  minimum: "German minimum wage acceptable"
  note: >
    Lane 2 is an income bridge, not a career move. Do not filter or score down
    roles on compensation. Minimum wage is fine. Evaluate purely on:
    (1) immediately or near-immediately startable,
    (2) legally workable under Working Holiday Visa,
    (3) manageable schedule (part-time and gig work both count).
    Flag any role that also has Lane 1 upside — e.g. admin at a creative agency,
    coordination at an events company — so it can be tracked separately.

location:
  country: "Germany"
  city: "Frankfurt am Main"
  timezone: "CET/CEST"
  visa_status: "Working Holiday Visa — legally permitted to work; verify any per-employer duration limits if applicable"
  onsite_availability: "Fully available on-site in Frankfurt; open to travel for tour or event roles"

constraints:
  language: >
    German is beginner level. For gig and service roles this is usually fine —
    prioritise roles where English is the working language, where multilingual
    service is valued, or where the work is physical/practical enough that
    language is not a barrier (dog sitting, cleaning, market work, etc.).
  avoid:
    - Roles legally requiring German language certification
    - Anything requiring a German driving licence (unless she has one)

evaluation_notes: >
  For ALL Lane 2 roles, apply minimal scoring thresholds. This is not a career
  filter — it is a practicality filter. The three questions are:
  (1) Can she legally do this on a Working Holiday Visa?
  (2) Can she start soon?
  (3) Is it in or near Frankfurt?
  If yes to all three: recommend it. Skip the A-F rubric for pure gig roles.
  Reserve fuller evaluation only for roles with genuine Lane 1 crossover potential.
